minimum_prek_version = "0.4.11"

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "check-added-large-files", args = ["--maxkb=1000"] },
  { id = "check-case-conflict" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "detect-private-key" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "prettier"
name = "Prettier"
entry = "pnpm exec prettier --write --ignore-unknown"
language = "system"
types = ["text"]

[[repos.hooks]]
id = "eslint"
name = "ESLint"
entry = "pnpm exec eslint --fix --max-warnings=0"
language = "system"
types_or = ["javascript", "jsx", "ts", "tsx"]

[[repos.hooks]]
id = "full-check"
name = "Full repository check"
entry = "pnpm check"
language = "system"
always_run = true
pass_filenames = false
stages = ["pre-push"]

[[repos]]
repo = "meta"
hooks = [
  { id = "check-hooks-apply" },
  { id = "check-useless-excludes" },
]
