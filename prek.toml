minimum_prek_version = "0.4.11"

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "check-added-large-files", args = ["--maxkb=1000"] },
  { id = "check-case-conflict" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "detect-private-key" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "prettier"
name = "Prettier"
entry = "pnpm exec prettier --write --ignore-unknown"
language = "system"
types = ["text"]

[[repos.hooks]]
id = "eslint"
name = "ESLint"
entry = "pnpm exec eslint --fix --max-warnings=0"
language = "system"
types_or = ["javascript", "jsx"]

[[repos.hooks]]
id = "oxlint"
name = "Oxlint"
entry = "pnpm exec oxlint"
language = "system"
types_or = ["javascript", "jsx"]

[[repos.hooks]]
id = "stylelint"
name = "Stylelint"
entry = "pnpm exec stylelint"
language = "system"
types = ["css"]

[[repos.hooks]]
id = "html-validate"
name = "HTML Validate"
entry = "pnpm exec html-validate"
language = "system"
types = ["html"]

[[repos.hooks]]
id = "typecheck"
name = "Strict JavaScript type check"
entry = "pnpm typecheck"
language = "system"
always_run = true
pass_filenames = false

[[repos.hooks]]
id = "full-check"
name = "Full repository check"
entry = "pnpm check"
language = "system"
always_run = true
pass_filenames = false
stages = ["pre-push"]

[[repos]]
repo = "meta"
hooks = [
  { id = "check-useless-excludes" },
]

[[repos]]
repo = "https://github.com/hadolint/hadolint"
rev = "v2.15.1"
hooks = [
  { id = "hadolint-docker" },
]
